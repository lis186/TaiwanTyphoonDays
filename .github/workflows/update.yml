name: update-data

on:
  schedule:
    # 18:37 Asia/Taipei every day. DGPA adds an event to its history list 0-9 days after the event (mostly the
    # next working day), so run after office hours; the counties' own announcements (evening before, or up to
    # 04:30 that morning) are not what this repo reads.
    - cron: '37 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # .cache/ holds the downloaded announcements. Without it the first run re-downloads everything (~15 min).
      - name: Restore source cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: dgpa-cache-${{ github.run_id }}
          restore-keys: dgpa-cache-

      - name: Crawl list
        run: python3 scripts/crawl_list.py

      - name: Fetch new announcements
        run: python3 scripts/fetch_all.py

      - name: Save source cache
        if: ${{ always() && !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: dgpa-cache-${{ github.run_id }}

      - name: Parse
        run: python3 scripts/parse.py

      # These must pass before anything is published.
      - name: Validate
        run: cd tests && python3 -m unittest test_parse test_data.Schema test_data.AuditAgainstCache

      - name: Commit and push
        run: |
          # stage first: a new year's file is untracked, and `git diff` would not see it
          git add data
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "data: update $(date -u +%F)"
          git push

      # Measurement only: does the CDN serve what was just published? Logged to build a record of the
      # commit-to-jsDelivr delay before deciding whether to purge (jsDelivr caches a branch path for up to 12 h).
      - name: Compare CDN copies
        continue-on-error: true
        run: |
          for f in $(git diff --name-only ${{ github.sha }} HEAD -- data); do
            for url in "https://cdn.jsdelivr.net/gh/${{ github.repository }}/$f" \
                       "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/$f"; do
              if curl -fsS "$url" | cmp -s - "$f"; then echo "same  $url"; else echo "STALE $url"; fi
            done
          done

      # GitHub disables the scheduled workflows of a public repository after 60 days without repository activity,
      # and the off-season (Dec-Mar) can easily pass without a data change. After 30 quiet days, leave a marker commit.
      - name: Keepalive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -lt $(( 30 * 86400 )) ]; then
            echo "last commit is recent; nothing to do"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          date -u +%F > .github/keepalive
          git add .github/keepalive
          git commit -m "chore: keepalive $(date -u +%F)"
          git push

      # Runs after publishing: a sentence the parser cannot read fails the run so that you get notified.
      # Review it, then extend scripts/parse.py or add the sentence to tests/known_unparsed.txt.
      - name: Format-drift check
        run: cd tests && python3 -m unittest test_data.FormatDrift
